<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#f7f8f6">
    <title>الصفحة غير موجودة | فارس علي</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
    <style>
      .not-found { min-height: 78vh; display: grid; place-items: center; text-align: center; }
      .not-found > div { max-width: 620px; padding: 48px 24px; }
      .not-found .code { margin: 0; color: var(--teal); font-size: clamp(5rem, 18vw, 10rem); font-weight: 800; line-height: 1; }
      .not-found h1 { margin: 16px 0 8px; font-size: clamp(1.8rem, 5vw, 2.8rem); }
      .not-found p { margin: 0 0 26px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar content-width" aria-label="التنقل الرئيسي">
        <a class="brand" href="/" aria-label="فارس علي - الرئيسية">فارس<span>.</span></a>
      </nav>
    </header>
    <main class="not-found content-width">
      <div>
        <p class="code" aria-hidden="true">404</p>
        <h1>الصفحة دي مش موجودة</h1>
        <p>يمكن الرابط اتغير أو الصفحة اتحذفت. تقدر ترجع للموقع من هنا.</p>
        <a class="button button-primary" href="/">العودة للرئيسية <span aria-hidden="true">←</span></a>
      </div>
    </main>
    <footer class="site-footer"><p>فارس علي <span aria-hidden="true">•</span> مونتاج، تصميم، وبرمجة</p></footer>
  </body>
</html>
